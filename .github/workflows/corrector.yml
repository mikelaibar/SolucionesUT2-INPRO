name: Comprobar el corrector UT2

on:
  push:
    paths:
      - 'CorrectorUT2/**'
      - 'Ejercicios1/**'
      - '.github/workflows/corrector.yml'
  pull_request:
    paths:
      - 'CorrectorUT2/**'
      - 'Ejercicios1/**'
      - '.github/workflows/corrector.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: CorrectorUT2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore --locked-mode
      - run: dotnet test --no-restore --logger "trx;LogFileName=corrector.trx"
        env:
          CORRECTOR_REFERENCIAS: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-corrector
          path: CorrectorUT2/Corrector.Tests/TestResults/*.trx
